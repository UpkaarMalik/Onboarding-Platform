services:
  postgres:
    image: postgres:16
    container_name: onboard-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: upkaarmalik
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: onboarding_db

    ports:
      - "5432:5432"

    volumes:
      - onboard_postgres_data:/var/lib/postgresql/data

volumes:
  onboard_postgres_data: